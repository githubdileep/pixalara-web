<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixalara - Coming Soon</title>
    
    <link rel="icon" href="pixalara_favicon.ico" type="image/png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { font-family: 'Inter', sans-serif; }
        
        /* Custom Animation Keyframes */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideUp {
            from { transform: translateY(32px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes slideDown {
            from { transform: translateY(-32px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes zoomIn {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .animate-fade-in-down { animation: slideDown 0.7s ease-out forwards; }
        .animate-zoom-in { animation: zoomIn 1s ease-out 0.2s forwards; opacity: 0; }
        .animate-slide-up-form { animation: slideUp 1s ease-out 0.5s forwards; opacity: 0; }
        .animate-fade-in-footer { animation: slideUp 0.7s ease-out 0.7s forwards; opacity: 0; }
        
        /* Selection Color */
        ::selection { background-color: #d946ef; color: white; }
    </style>
</head>
<body class="bg-[#0f0c29] text-white min-h-screen relative selection:bg-fuchsia-500 selection:text-white">

    <div id="parallax-bg" class="fixed inset-0 z-0 pointer-events-none">
        <div class="absolute inset-0 bg-[radial-gradient(circle_at_100%_0%,#3b0764_0%,#1e1b4b_50%,#0f0c29_100%)] opacity-80"></div>
        <div class="absolute bottom-[-20%] left-[-20%] w-[800px] h-[800px] bg-cyan-900/10 rounded-full blur-[120px] animate-pulse"></div>
    </div>

    <div class="fixed inset-0 z-0 opacity-[0.04] pointer-events-none" style="background-image: url('https://grainy-gradients.vercel.app/noise.svg');"></div>

    <div class="relative z-10 container mx-auto px-6 min-h-[100dvh] flex flex-col justify-between pt-8 pb-8 md:pt-12 md:pb-12">
        
        <nav class="flex justify-between items-center animate-fade-in-down">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 relative shrink-0">
                    <div class="absolute inset-0 bg-gradient-to-tr from-cyan-400 to-fuchsia-500 rounded-lg transform rotate-3"></div>
                    <div class="absolute inset-0 bg-[#0f0c29] rounded-lg m-[2px] flex items-center justify-center">
                        <span class="font-bold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-fuchsia-500 text-lg">P</span>
                    </div>
                </div>
                <span class="font-bold text-xl tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-fuchsia-500">PIXALARA</span>
            </div>
        </nav>

        <main class="flex-1 flex flex-col justify-center items-center text-center max-w-4xl mx-auto w-full space-y-6 pb-12">
            
            <div class="space-y-6 animate-zoom-in">
                <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full border border-white/10 bg-white/5 backdrop-blur-md shadow-xl hover:border-cyan-500/30 transition-colors cursor-default">
                    <i data-lucide="sparkles" class="w-3.5 h-3.5 text-cyan-400 animate-pulse"></i>
                    <span class="text-xs md:text-sm font-medium tracking-widest uppercase text-cyan-100/80">Launching Soon</span>
                </div>

                <h1 class="text-4xl sm:text-6xl md:text-7xl lg:text-8xl font-black tracking-tighter leading-[1.1]">
                    <span class="block text-transparent bg-clip-text bg-gradient-to-b from-white via-white to-slate-400">
                        YOUR VISION,
                    </span>
                    <span class="block text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-fuchsia-500 to-purple-500 drop-shadow-2xl">
                        OUR CREATION.
                    </span>
                </h1>

                <p class="text-slate-400 text-sm md:text-xl max-w-2xl mx-auto leading-relaxed font-light px-4">
                    We are redefining the digital landscape. Pixalara turns your unique ideas into stunning digital realities. 
                </p>

                <div class="flex justify-center items-center gap-4 md:gap-8 py-4">
                    <div class="flex flex-col items-center">
                        <div id="days" class="text-3xl md:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-b from-white to-cyan-400">00</div>
                        <div class="text-[10px] md:text-xs uppercase tracking-[0.2em] text-slate-500 font-bold">Days</div>
                    </div>
                    <div class="text-2xl md:text-4xl font-light text-slate-700">:</div>
                    <div class="flex flex-col items-center">
                        <div id="hours" class="text-3xl md:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-b from-white to-fuchsia-400">00</div>
                        <div class="text-[10px] md:text-xs uppercase tracking-[0.2em] text-slate-500 font-bold">Hours</div>
                    </div>
                    <div class="text-2xl md:text-4xl font-light text-slate-700">:</div>
                    <div class="flex flex-col items-center">
                        <div id="minutes" class="text-3xl md:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-b from-white to-cyan-400">00</div>
                        <div class="text-[10px] md:text-xs uppercase tracking-[0.2em] text-slate-500 font-bold">Mins</div>
                    </div>
                    <div class="text-2xl md:text-4xl font-light text-slate-700">:</div>
                    <div class="flex flex-col items-center">
                        <div id="seconds" class="text-3xl md:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-b from-white to-fuchsia-400">00</div>
                        <div class="text-[10px] md:text-xs uppercase tracking-[0.2em] text-slate-500 font-bold">Secs</div>
                    </div>
                </div>
            </div>

            <div class="w-full max-w-md animate-slide-up-form flex flex-col items-center space-y-8">
                
                <div class="flex items-center gap-8 mt-2">
                    <a href="https://www.linkedin.com/company/pixalara/" target="_blank" class="text-slate-400 transition-all duration-300 transform hover:-translate-y-1 hover:scale-110 hover:text-blue-500">
                        <i data-lucide="linkedin" class="w-7 h-7"></i>
                    </a>
                    
                    <a href="https://x.com/pixalara" target="_blank" class="text-slate-400 transition-all duration-300 transform hover:-translate-y-1 hover:scale-110 hover:text-white">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6">
                            <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z" />
                        </svg>
                    </a>
                    
                    <a href="https://www.instagram.com/pixalara/" target="_blank" class="text-slate-400 transition-all duration-300 transform hover:-translate-y-1 hover:scale-110 hover:text-pink-500">
                        <i data-lucide="instagram" class="w-7 h-7"></i>
                    </a>
                </div>

                <form id="emailForm" class="w-full max-w-sm relative group">
                    <div class="absolute -inset-1 bg-gradient-to-r from-cyan-500 to-fuchsia-500 rounded-xl blur opacity-25 group-hover:opacity-50 transition duration-500"></div>
                    <div class="relative flex items-center bg-[#1a1638] rounded-xl p-1.5 border border-white/10 shadow-2xl">
                        <input type="email" required placeholder="Enter your email for updates" 
                            class="flex-1 bg-transparent border-none text-white placeholder-slate-500 focus:outline-none px-4 py-3 text-sm w-full">
                        <button type="submit" class="bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white p-2 rounded-lg transition-all duration-300 transform hover:scale-105 shadow-lg active:scale-95">
                            <i data-lucide="chevron-right" class="w-5 h-5"></i>
                        </button>
                    </div>
                </form>

                <div id="successMessage" class="hidden w-full bg-[#1a1638] border border-green-500/30 rounded-xl p-4 text-center">
                    <div class="flex items-center justify-center gap-2 text-green-400 mb-1">
                        <i data-lucide="check-circle" class="w-5 h-5"></i>
                        <span class="font-bold text-white text-sm">Added to list!</span>
                    </div>
                    <p class="text-slate-400 text-xs">We'll keep you posted.</p>
                </div>
            </div>
        </main>

        <footer class="border-t border-white/5 pt-8 mt-auto animate-fade-in-footer flex justify-center w-full">
            <p class="text-slate-500 text-xs md:text-sm text-center">
                © 2025 Pixalara. All rights reserved.
            </p>
        </footer>
    </div>

    <script>
        // 1. Initialize Icons
        lucide.createIcons();

        // 2. Parallax Mouse Effect
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth) * 20;
            const y = (e.clientY / window.innerHeight) * 20;
            const bg = document.getElementById('parallax-bg');
            if(bg) { bg.style.transform = `translate(-${x}px, -${y}px)`; }
        });

        // 3. Countdown Timer Logic
        function updateCountdown() {
            // Set Launch Date to Dec 24, 2025
            const launchDate = new Date("December 24, 2025 00:00:00").getTime();
            const now = new Date().getTime();
            const diff = launchDate - now;

            if (diff > 0) {
                const d = Math.floor(diff / (1000 * 60 * 60 * 24));
                const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((diff % (1000 * 60)) / 1000);

                document.getElementById("days").innerText = d.toString().padStart(2, '0');
                document.getElementById("hours").innerText = h.toString().padStart(2, '0');
                document.getElementById("minutes").innerText = m.toString().padStart(2, '0');
                document.getElementById("seconds").innerText = s.toString().padStart(2, '0');
            } else {
                document.getElementById("days").parentElement.parentElement.innerHTML = 
                    "<span class='text-2xl font-bold text-cyan-400 animate-pulse uppercase tracking-widest'>We Are Live!</span>";
            }
        }
        setInterval(updateCountdown, 1000);
        updateCountdown();

        // 4. Handle Form Submission
        const form = document.getElementById('emailForm');
        const successMsg = document.getElementById('successMessage');

        if(form) {
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                form.style.display = 'none';
                successMsg.classList.remove('hidden');
                
                setTimeout(() => {
                    form.reset();
                    form.style.display = 'flex';
                    successMsg.classList.add('hidden');
                }, 5000);
            });
        }
    </script>
</body>
</html>
