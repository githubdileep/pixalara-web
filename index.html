<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixalara - Coming Soon</title>
    
    <!-- Favicon -->
    <link rel="icon" href="pixalara_favicon.ico" type="image/png">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { font-family: 'Inter', sans-serif; }
        
        /* Custom Animation Keyframes */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideUp {
            from { transform: translateY(32px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes slideDown {
            from { transform: translateY(-32px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes zoomIn {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .animate-fade-in-down { animation: slideDown 0.7s ease-out forwards; }
        .animate-zoom-in { animation: zoomIn 1s ease-out 0.2s forwards; opacity: 0; }
        .animate-slide-up-form { animation: slideUp 1s ease-out 0.5s forwards; opacity: 0; }
        .animate-fade-in-footer { animation: slideUp 0.7s ease-out 0.7s forwards; opacity: 0; }
        
        /* Selection Color */
        ::selection { background-color: #d946ef; color: white; }
    </style>
</head>
<body class="bg-[#090720] text-white min-h-screen overflow-hidden relative">

    <!-- Dynamic Background Elements (Parallax Layer) -->
    <div id="parallax-bg" class="absolute inset-0 z-0 opacity-50 pointer-events-none transition-transform duration-100 ease-out">
        <div class="absolute top-[-20%] right-[-10%] w-[700px] h-[700px] bg-fuchsia-600/20 rounded-full blur-[150px] animate-pulse"></div>
        <div class="absolute bottom-[-10%] left-[-5%] w-[600px] h-[600px] bg-cyan-500/15 rounded-full blur-[120px]"></div>
        <div class="absolute top-[30%] left-[-10%] w-[400px] h-[400px] bg-blue-600/15 rounded-full blur-[100px]"></div>
        <div class="absolute bottom-[10%] right-[10%] w-[300px] h-[300px] bg-purple-600/15 rounded-full blur-[80px]"></div>
    </div>

    <!-- Noise Overlay -->
    <div class="absolute inset-0 z-0 opacity-10 pointer-events-none" style="background-image: url('https://grainy-gradients.vercel.app/noise.svg');"></div>

    <!-- Main Content -->
    <!-- RESET: Reduced pb-36 back to pb-8 to keep the footer at the bottom -->
    <div class="relative z-10 container mx-auto px-6 h-screen flex flex-col justify-between pt-8 pb-8 md:pt-12 md:pb-12">
        
        <!-- Navbar -->
        <nav class="flex justify-between items-center animate-fade-in-down">
            <div class="flex items-center gap-2">
                <!-- Logo Icon -->
                <div class="w-8 h-8 relative">
                    <div class="absolute inset-0 bg-gradient-to-tr from-cyan-400 to-fuchsia-500 rounded-lg transform rotate-3"></div>
                    <div class="absolute inset-0 bg-[#0f0c29] rounded-lg m-[2px] flex items-center justify-center">
                        <span class="font-bold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-fuchsia-500 text-lg">P</span>
                    </div>
                </div>
                <!-- Gradient Text Logo -->
                <span class="font-bold text-xl tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-fuchsia-500">PIXALARA</span>
            </div>
        </nav>

        <!-- Hero Section -->
        <!-- CHANGED: Added pb-32 md:pb-48 to push the centered content (including icons) higher up the screen -->
        <main class="flex-1 flex flex-col justify-center items-center text-center max-w-4xl mx-auto w-full space-y-6 pb-32 md:pb-48">
            
            <div class="space-y-6 animate-zoom-in">
                <!-- Tagline Badge -->
                <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full border border-white/10 bg-white/5 backdrop-blur-md shadow-xl hover:border-cyan-500/30 transition-colors cursor-default">
                    <i data-lucide="sparkles" class="w-3.5 h-3.5 text-cyan-400 animate-pulse"></i>
                    <span class="text-xs md:text-sm font-medium tracking-widest uppercase text-cyan-100/80">Coming Soon</span>
                </div>

                <!-- Main Title -->
                <h1 class="text-5xl md:text-7xl lg:text-8xl font-black tracking-tighter leading-[1.1]">
                    <span class="block text-transparent bg-clip-text bg-gradient-to-b from-white via-white to-slate-400">
                        YOUR VISION,
                    </span>
                    <span class="block text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-fuchsia-500 to-purple-500 drop-shadow-2xl">
                        OUR CREATION.
                    </span>
                </h1>

                <!-- Subtitle -->
                <p class="text-slate-400 text-base md:text-xl max-w-2xl mx-auto leading-relaxed font-light">
                    We are redefining the digital landscape. Pixalara turns your unique ideas into stunning digital realities. 
                    <span class="hidden md:inline"> Get ready to elevate your brand presence like never before.</span>
                </p>
            </div>

            <!-- Follow Us / Links Section -->
            <div class="w-full max-w-md animate-slide-up-form flex flex-col items-center space-y-6">
                <div class="flex items-center gap-8 mt-0">
                    <!-- LinkedIn -->
                    <a href="https://www.linkedin.com/company/pixalara/" target="_blank" class="text-slate-400 transition-all duration-300 transform hover:-translate-y-1 hover:scale-110 hover:text-blue-500">
                        <i data-lucide="linkedin" class="w-7 h-7"></i>
                    </a>
                    <!-- Twitter/X -->
                    <a href="https://x.com/pixalara" target="_blank" class="text-slate-400 transition-all duration-300 transform hover:-translate-y-1 hover:scale-110 hover:text-cyan-400">
                        <i data-lucide="twitter" class="w-7 h-7"></i>
                    </a>
                    <!-- Instagram -->
                    <a href="https://www.instagram.com/pixalara/" target="_blank" class="text-slate-400 transition-all duration-300 transform hover:-translate-y-1 hover:scale-110 hover:text-pink-500">
                        <i data-lucide="instagram" class="w-7 h-7"></i>
                    </a>
                </div>
            </div>

        </main>

        <!-- Footer -->
        <footer class="border-t border-white/5 pt-8 mt-auto animate-fade-in-footer flex justify-center">
            <p class="text-slate-500 text-xs md:text-sm text-center">
                © 2025 Pixalara. All rights reserved.
            </p>
        </footer>

    </div>

    <!-- Scripts for Interactivity -->
    <script>
        // 1. Initialize Icons
        lucide.createIcons();

        // 2. Parallax Mouse Effect
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth) * 20;
            const y = (e.clientY / window.innerHeight) * 20;
            const bg = document.getElementById('parallax-bg');
            // Move background in opposite direction of mouse
            bg.style.transform = `translate(-${x}px, -${y}px)`;
        });
    </script>
</body>
</html>
