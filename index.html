<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixalara | Coming Soon</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">
</head>
<body>

    <div class="nebula-bg">
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
    </div>

    <div class="content-container">
        <h1 class="logo-text">PIXALARA</h1>

        <div class="coming-soon">
            <h2>Crafting Digital Visions. Launching Soon.</h2>
            <p>We're polishing the final pixels. Join our waitlist for launch updates!</p>
        </div>

        <div id="countdown" class="countdown">
            <div class="countdown-unit"><span id="days">00</span> DAYS</div>
            <div class="countdown-unit"><span id="hours">00</span> HOURS</div>
            <div class="countdown-unit"><span id="minutes">00</span> MINUTES</div>
            <div class="countdown-unit"><span id="seconds">00</span> SECONDS</div>
        </div>

        <form class="subscribe-form">
            <input type="email" placeholder="Enter your email address..." required>
            <button type="submit">Notify Me</button>
        </form>
    </div>

    <script src="script.js"></script>


    <div id="thankYouModal" class="modal-overlay">
        <div class="modal-content">
            <h3 class="modal-title">Thank You, Pixalara Pioneer!</h3>
            <p>You're officially on the list. We'll notify you the moment we launch on January 1, 2026.</p>
            <button id="closeModal" class="modal-button">Awesome!</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
